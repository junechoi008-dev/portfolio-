const STAGE_W = 1920, STAGE_H = 747;
function CoverStage({ children }) {
  const ref = React.useRef(null);
  const [s, setS] = React.useState(1);
  React.useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const fit = () => setS(el.clientWidth / STAGE_W);
    fit(); const ro = new ResizeObserver(fit); ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return <div ref={ref} style={{ position: 'relative', width: '100%', height: Math.floor(STAGE_H * s), overflow: 'hidden' }}>
    <div style={{ position: 'absolute', left: 0, top: 0, width: STAGE_W, transform: 'scale(' + s + ')', transformOrigin: '0 0' }}>{children}</div>
  </div>;
}

function DoorArrow() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const place = () => {
      const el = ref.current, bd = document.getElementById('jp-building'), nm = document.getElementById('jp-hello-name');
      if (!el || !bd || !nm || !el.offsetParent) return;
      if (window.innerWidth <= 1024) { el.style.opacity = 0; return; }
      const root = el.offsetParent.getBoundingClientRect(), B = bd.getBoundingClientRect(), N = nm.getBoundingClientRect();
      const fx = B.left + B.width * 0.6423 - root.left, fy = B.top + B.height * 0.454 - root.top;
      const tx = N.left + N.width * 0.45 - root.left, ty = N.top - 2 - root.top;
      const iw = 286, ih = 244, ax = iw * 0.923, ay = ih * 0.094, bx = iw * 0.031, by = ih * 0.955;
      const s = Math.hypot(tx - fx, ty - fy) / Math.hypot(bx - ax, by - ay);
      if (s > 1.4 || s < 0.3) { el.style.opacity = 0; return; }
      const r = Math.atan2(ty - fy, tx - fx) - Math.atan2(by - ay, bx - ax);
      el.style.transform = 'translate(' + fx + 'px,' + fy + 'px) rotate(' + r + 'rad) scale(' + s + ') translate(' + (-ax) + 'px,' + (-ay) + 'px)';
      el.style.opacity = 1;
    };
    place();
    const ro = new ResizeObserver(place); ro.observe(document.body);
    window.addEventListener('resize', place); document.fonts && document.fonts.ready.then(place);
    const bd = document.getElementById('jp-building'); bd && bd.addEventListener('load', place);
    const t = setTimeout(place, 600);
    return () => { ro.disconnect(); window.removeEventListener('resize', place); clearTimeout(t); };
  }, []);
  return <img ref={ref} src="assets/drawings/profile-arrow.png" alt="" aria-hidden="true" style={{ position: 'absolute', left: 0, top: 0, width: 286, height: 244, transformOrigin: '0 0', zIndex: 8, pointerEvents: 'none', opacity: 0 }} />;
}
