<style>
.a2x-scroll{overflow-x:auto;padding:var(--space-2) var(--space-2) var(--space-3);margin:0 calc(-1 * var(--space-2))}
.a2x{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--space-5);row-gap:var(--space-4);min-width:720px;font-family:var(--font-body);color:var(--color-ink)}
.a2x-h{display:flex;align-items:center;gap:var(--space-3);font:700 13px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--color-charcoal)}
.a2x-hl{flex:none;white-space:nowrap}.a2x-h>i{flex:1;min-width:var(--space-3);align-self:center;height:1px;position:relative}.a2x-ln{background:var(--color-charcoal)}.a2x-ln.out{margin-right:calc(-1 * var(--space-5))}.a2x-ln.in::after{content:"";position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid var(--color-charcoal);border-right:0}.a2x-ln .a2x-chip{position:absolute;bottom:4px;right:calc(var(--space-5) / -2);transform:translateX(50%);background:none;padding:0;color:var(--color-charcoal);font-style:normal}.a2x-arrow .a2x-chip{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:none;padding:0;color:var(--color-charcoal)}.a2x-arrow{flex:1;min-width:40px;position:relative;height:1px;background:var(--color-charcoal);margin-right:calc(-1 * var(--space-5) + 4px);display:flex;justify-content:center;align-items:center}
.a2x-arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid var(--color-charcoal);border-right:0}
.a2x-chip{font:500 13px/1.3 var(--font-body);letter-spacing:0;text-transform:none;color:var(--color-ink);background:var(--color-paper-deep);border-radius:4px;padding:2px 8px;white-space:nowrap;position:relative;z-index:1}
.a2x-col{display:flex;flex-direction:column;gap:var(--space-3)}
.a2x-card{background:var(--color-paper-light);filter:drop-shadow(var(--shadow-paper));padding:0 var(--space-3) var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);flex:1}
.a2x-ch{align-self:center;min-width:80%;white-space:nowrap;text-align:center;background:var(--color-primary);color:var(--color-paper-light);font:500 13px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;padding:6px var(--space-3);font-size:12px}
.a2x-t{margin:0;font:400 14px/1.45 var(--font-body);color:var(--color-ink)}

.a2x-img{display:block;width:100%;height:auto;border:1px solid var(--color-line)}
.a2x-per{display:flex;flex-wrap:wrap;gap:var(--space-4) var(--space-7);margin-bottom:var(--space-6)}
.a2x-p{display:flex;align-items:center;gap:var(--space-3)}
.a2x-p img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--color-paper-light);filter:drop-shadow(var(--shadow-paper))}
.a2x-pt{display:flex;flex-direction:column;gap:2px;min-width:0}.a2x-pk{font:500 13px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-primary)}.a2x-pn{font:700 15px/1.3 var(--font-body);color:var(--color-ink)}.a2x-ph{font:400 13px/1.4 var(--font-body);color:var(--color-charcoal)}
.a2x-promo>.a2x-card{flex:none}.a2x-promo>.a2x-vlink{flex:1;justify-content:center;min-height:56px}
.a2x-vlink{display:flex;flex-direction:column;align-items:center;position:relative;padding:var(--space-2) 0}
.a2x-vlink::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--color-charcoal)}
.a2x-vlink::after{content:"";position:absolute;bottom:-2px;left:calc(50% - 4px);border:4.5px solid transparent;border-top:7px solid var(--color-charcoal);border-bottom:0}
.a2x-loop{grid-column:1 / 4;position:relative;height:40px;margin-top:calc(-1 * var(--space-4))}
.a2x-loop>i{position:absolute;left:calc((100% - 2 * var(--space-5)) / 6);right:calc((100% - 2 * var(--space-5)) / 6);top:0;bottom:12px;border:1px solid var(--color-charcoal);border-top:0}
.a2x-loop>i::before{content:"";position:absolute;left:-5px;top:-2px;border:4.5px solid transparent;border-bottom:7px solid var(--color-charcoal);border-top:0}
.a2x-loop>span{position:absolute;left:50%;bottom:12px;transform:translate(-50%,50%)}
.cs-sec{margin-bottom:88px}.cs-band{padding-bottom:48px!important}.cs-band:has([data-screen-label="Outcome"]){margin-bottom:0!important}main.paper{padding-bottom:0!important}main.paper>:last-child:not(.cs-band){display:none}
.a2-src{margin:0;font:400 11px/1.45 var(--font-body);color:var(--color-charcoal)}

<body>
<div id="root"></div>
<script type="text/babel" src="case-kit.jsx"></script>
<script type="text/babel">
const hero = {
  eyebrow: 'Yonsei Milk · A2 Protein Milk',
  title: 'A2 Milk Launch Campaign',
  desc: <>As Korean consumers showed growing interest in premium milk, Yonsei Milk launched its own A2 protein milk. To win customers from the #1 competitor, we ran customer research and social listening, and defined two target groups, each with its own message, strategy and channels.</>,
  ownedPaper: true,
  compact: true,
  mediaW: '86%',
  ownedNote: <>I took the customer, competitor and market research and built the proposal storyline and presentation. I also designed the digital funnel, the media &amp; content plan and the budget. I then ran the campaigns: content scheduling, influencer marketing and weekly/monthly reporting with A/B testing.</>,
  overview: [['Period', 'Feb 2024 – Jun 2024'], ['Role', 'Senior Account Executive'], ['Channels', 'Netflix · YouTube · Naver · Instagram'], ['Discipline', 'IMC · Full funnel']],
  media: <Photo id="a2-hero" src="uploads/pasted-1788208183406-0.png" ratio="729/403" tilt={-1.5} tape={false} onRed placeholder="Drop the campaign key visual" />,
};
const Film = ({ k, items, lines }) => <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
  <Frames items={items} n={3} />
  <Item kicker={k}>{lines.map((l, i) => <Sm key={i}>{i === lines.length - 1 ? <strong style={{ color: 'var(--color-ink)' }}>{l}</strong> : l}</Sm>)}</Item>
</div>;
const a2Ax = { font: '400 12px/1 var(--font-body)', color: 'var(--color-charcoal)' };
function Plot({ yTicks, yTicksR, xLabels, children, overlay, wrap, h = 150 }) {
  return <div style={{ display: 'grid', gridTemplateColumns: 'auto minmax(0,1fr)' + (yTicksR ? ' auto' : ''), columnGap: 'var(--space-2)' }}>
    <div style={{ ...a2Ax, display: 'flex', flexDirection: 'column-reverse', justifyContent: 'space-between', height: h, textAlign: 'right', margin: '-6px 0' }}>{yTicks.map((t) => <span key={t}>{t}</span>)}</div>
    <div style={{ position: 'relative', height: h, borderBottom: '1px solid var(--color-charcoal)' }}>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', overflow: 'visible' }}>
        {yTicks.map((t, i) => <line key={t} x1="0" x2="100" y1={100 - i * 100 / (yTicks.length - 1)} y2={100 - i * 100 / (yTicks.length - 1)} stroke="var(--color-line)" strokeWidth="1" vectorEffect="non-scaling-stroke" />)}
        {children}
      </svg>
      {overlay}
    </div>
    {yTicksR && <div style={{ ...a2Ax, display: 'flex', flexDirection: 'column-reverse', justifyContent: 'space-between', height: h, margin: '-6px 0' }}>{yTicksR.map((t) => <span key={t}>{t}</span>)}</div>}
    <div></div>
    <div style={{ position: 'relative', height: wrap ? 34 : 18, marginTop: 'var(--space-2)' }}>{xLabels.map(([x, l]) => <span key={l} style={{ ...a2Ax, lineHeight: 1.3, position: 'absolute', left: x + '%', transform: 'translateX(-50%)', textAlign: 'center', width: wrap ? '32%' : 'auto', whiteSpace: wrap ? 'normal' : 'nowrap' }}>{l}</span>)}</div>
  </div>;
}
const Line = ({ pts, color, w = 2.5, dash, dots }) => <>
  <polyline points={pts.map(([x, y]) => x + ',' + y).join(' ')} fill="none" stroke={color} strokeWidth={w} strokeDasharray={dash} vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
  {dots && pts.map(([x, y], i) => <path key={i} d={'M' + x + ' ' + y + 'h0'} stroke={color} strokeWidth="7" strokeLinecap="round" vectorEffect="non-scaling-stroke" />)}
</>;
const Legend = ({ items }) => <div style={{ display: 'flex', justifyContent: 'center', flexWrap: 'wrap', gap: 'var(--space-3)', font: '500 12px/1.3 var(--font-body)' }}>{items.map(([l, c, k]) => <span key={l} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: 'var(--color-ink)', whiteSpace: 'nowrap' }}><span style={k === 'dot' ? { width: 9, height: 9, borderRadius: '50%', background: c } : k === 'box' ? { width: 10, height: 10, background: c, border: '1px solid var(--color-charcoal)' } : { width: 16, borderTop: (k === 'dash' ? '2px dashed ' : '3px solid ') + c }}></span>{l}</span>)}</div>;
function SearchChart() {
  const X = (i) => 4 + i * 11.5, Y = (v) => 100 - v;
  const no = [35, 95, 35, 11, 35, 17, 40, 36, 44], yo = [5, 28, 19, 30, 28, 56, 48, 57, 66];
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
    <Plot yTicks={[0, 25, 50, 75, 100]} xLabels={[[X(0), 'Jan'], [X(2), 'Mar'], [X(5), 'Jun'], [X(8), 'Sep']]}>
      <rect x={X(2)} y="0" width={X(5) - X(2) - 6} height="100" fill="var(--color-paper-deep)" />
      <Line pts={no.map((v, i) => [X(i), Y(v)])} color="var(--color-charcoal)" w={2} dash="5 4" />
      <Line pts={yo.map((v, i) => [X(i), Y(v)])} color="var(--color-primary)" w={3} />
    </Plot>
    <Legend items={[['New Origin', 'var(--color-charcoal)', 'dash'], ['Yonsei', 'var(--color-primary)']]} />
  </div>;
}
function AdChart() {
  const g = [['Industry peers', 37.4, 28], ['Lookalike audience', 43.77, 26], ['Yonsei', 50.71, 24]], X = [18, 50, 82];
  const lab = (k, x, y, t, s) => <span key={k} style={{ position: 'absolute', left: x + '%', top: y + '%', transform: 'translate(-50%,-130%)', whiteSpace: 'nowrap', ...s }}>{t}</span>;
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
    <Plot yTicks={['0', '10%', '20%', '30%', '40%', '50%', '60%']} xLabels={g.map((d, i) => [X[i], d[0]])} wrap overlay={<>
      {g.map((d, i) => lab('v' + i, X[i], 100 - d[1] / 60 * 100, d[1].toFixed(2) + '%', { font: (i === 2 ? '700 ' : '500 ') + '12px/1 var(--font-body)', color: i === 2 ? 'var(--color-primary)' : 'var(--color-charcoal)' }))}
      {g.map((d, i) => lab('c' + i, X[i], 100 - d[2] / 80 * 100, d[2], { font: '700 12px/1 var(--font-body)', color: 'var(--color-ink)', background: 'var(--color-paper-light)', border: '1px solid var(--color-charcoal)', borderRadius: 4, padding: '2px 6px' }))}
    </>}>
      {g.map((d, i) => <rect key={i} x={X[i] - 8} y={100 - d[1] / 60 * 100} width="16" height={d[1] / 60 * 100} fill={i === 2 ? 'var(--color-primary)' : 'var(--color-paper-deep)'} stroke={i === 2 ? 'none' : 'var(--color-charcoal)'} strokeWidth="1" vectorEffect="non-scaling-stroke" />)}
      <Line pts={g.map((d, i) => [X[i], 100 - d[2] / 80 * 100])} color="var(--color-ink)" w={1.5} dots />
    </Plot>
    <Legend items={[['VTR', 'var(--color-paper-deep)', 'box'], ['CPV (won)', 'var(--color-ink)', 'dot']]} />
  </div>;
}
function SalesChart() {
  const X = [8, 36, 64, 92], v = [5, 100, 200, 530];
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
    <Plot yTicks={[0, 200, 400, 600]} xLabels={[[X[0], 'Oct 23'], [X[1], 'Dec 23'], [X[2], 'Mar 24'], [X[3], 'Jun 24']]}>
      <rect x={X[2]} y="0" width={X[3] - X[2]} height="100" fill="var(--color-paper-deep)" />
      <Line pts={v.map((n, i) => [X[i], 100 - n / 600 * 100])} color="var(--color-primary)" w={3} dots />
    </Plot>
    <Legend items={[['Number of units sold', 'var(--color-primary)']]} />
  </div>;
}
const CK2 = window.JunePortfolioDesignSystem_6caff1;
const CopyNote = ({ label, quote, children, tilt, back }) => <div style={{ position: 'relative', zIndex: 2, padding: '0 0 var(--space-2) var(--space-4)', marginTop: 'var(--space-4)' }}>
  <div className="paper" style={{ position: 'absolute', inset: '0 0 var(--space-2) var(--space-4)', transform: 'rotate(' + back + 'deg) translate(6px,6px)', filter: 'drop-shadow(var(--shadow-paper))' }}></div>
  <CK2.GridPaper tilt={tilt} style={{ padding: 'var(--space-4)', color: 'var(--color-ink)' }}>
    <div className="cs-group" style={{ gap: 'var(--space-2)' }}>{label && <span className="a2x-pk">{label}</span>}<span style={{ font: 'italic 400 24px/1.2 var(--font-display)' }}>{quote}</span><Sm>{children}</Sm></div>
  </CK2.GridPaper>
  {[['12%', 86], ['88%', 93]].map(([l, d]) => <span key={l} aria-hidden="true" className="tape-img tape-img--beige" style={{ position: 'absolute', zIndex: 3, width: 54, height: 26, aspectRatio: 'auto', left: l, top: 'calc(var(--space-4) / -2)', transform: 'translate(-50%,-50%) rotate(' + (d + tilt * 2) + 'deg)' }}></span>)}
</div>;
function ActionPlan() {
  const Card = ({ ch, children, img }) => <div className="a2x-card"><div className="a2x-ch">{ch}</div>{children && <p className="a2x-t">{children}</p>}{img && <img className="a2x-img" src={img} alt="" />}</div>;
  return <div className="a2x-scroll">
    <div className="a2x">
    <div className="a2x-h"><i></i><span className="a2x-hl">Paid media</span><i className="a2x-ln out"><span className="a2x-chip">Searching</span></i></div>
    <div className="a2x-h"><i className="a2x-ln in"></i><span className="a2x-hl">Content</span><i className="a2x-ln out"><span className="a2x-chip">Landing</span></i></div>
    <div className="a2x-h"><i className="a2x-ln in"></i><span className="a2x-hl">Promotion</span><i></i></div>
    <div className="a2x-col">
      <Card ch="Netflix">Delivers <b>over 95% guaranteed view-through rate (VTR) through TV</b></Card>
      <Card ch="YouTube">Targets users by age, gender and interests; A/B tested with bumper ads</Card>
      <Card ch="Naver">Allows detailed <b>targeting of parents</b> on Korea's leading search platform</Card>
      <Card ch="Instagram">Cost-effective platform with high reach potential</Card>
    </div>
    <div className="a2x-col">
      <Card ch="SEO">SEO-driven blog content strategy for top visibility on 'A2 milk' queries</Card>
      <Card ch="Influencer marketing" img="uploads/pasted-1792266861585-0.png">Sponsored branded content on channels the target already watches, for education or everyday exposure</Card>
      <Card ch="Review content">Released a series of native-style posts resembling authentic user feedback</Card>
    </div>
    <div className="a2x-col a2x-promo" style={{ gap: 0 }}>
      <Card ch="Online store">Set up a landing page for every piece of content and ran discount promotions</Card>
      <div className="a2x-vlink"><span className="a2x-chip">Customer feedback</span></div>
      <div style={{ height: 'var(--space-2)' }}></div>
      <Card ch="Review content" img="uploads/pasted-1792267014130-0.png">Ran discount promotions and review events that encouraged customers to leave reviews</Card>
    </div>
    <div className="a2x-loop"><i></i><span className="a2x-chip">Visitor retargeting</span></div>
  </div></div>;
}
function App() {
  return <CasePage nav="Core project 01" hero={hero}>
    <CaseSection num="01" title="The Challenge">
      <div style={{ display: 'grid', gridTemplateColumns: '180px minmax(0,1fr)', gap: 'var(--space-5)', alignItems: 'center' }}>
        <Photo id="a2-product" src="uploads/efa6d500-eed9-4d9e-a03d-13e80cdf6560.jpg" ratio="1/1" tilt={-3} tape={1} placeholder="Drop the product shot" />
        <P lead>At launch, there were two main challenges. First, A2 milk was unfamiliar to Korean consumers and not yet widely consumed, so we needed to educate customers about the new product while building a strong, reliable brand. Second was the competitive landscape: the domestic A2 milk market had a single dominant player, <strong>New Origin</strong>, which imported its A2 milk from abroad. At the same time, <strong>Seoul Milk, Korea's No.1 dairy brand, was expected to launch its own A2 milk within five months</strong>, which turned the brief into a race for first-mover advantage. Everything had to be built to win awareness and conversion before that entry.</P>
      </div>
      <Group label="Objectives"><Cols n={3}>
        <Item kicker="01"><P>Convert New Origin's customers to Yonsei Milk</P></Item>
        <Item kicker="02"><P>Secure top-of-mind awareness before Seoul Milk's entry</P></Item>
        <Item kicker="03"><P>Establish early dominance in the A2 milk market</P></Item>
      </Cols></Group>
    </CaseSection>
    <Band>
    <CaseSection num="02" title="Creative">
      <Group label="Jobs to be done">
        <P>Our main target was post-weaning moms looking for the first milk after breastfeeding. The sub-target was broader: people simply looking for a premium milk. We conducted customer, market and competitor research and found the insight: moms feel responsible for their toddlers' first milk and are willing to pay a higher price for it. On the other hand, many Koreans think they are lactose intolerant and choose not to drink milk, even though some of them would be fine with A2 milk. Based on that, we defined our targets and built a different story for each.</P>
      </Group>
      <Group label="Target audience & copywriting"><Cols n={2} style={{ alignItems: 'start' }}>
        <div className="a2-pair"><Label red>Main target</Label><Note tilt={-0.8} tape={false} pad="var(--space-4)"><div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'center' }}><img src="uploads/a2-tg-main.png" alt="" style={{ width: 88, height: 88, borderRadius: '50%', objectFit: 'cover', flex: 'none' }} /><div className="cs-group" style={{ gap: 'var(--space-2)' }}><h4 className="cs-h4">Post-weaning moms</h4><Sm>Mothers in their 30s–40s who recently stopped breastfeeding, seeking a safe, high-quality alternative for their children.</Sm><Sm>#3040 #babyfood #parenting</Sm></div></div></Note>
          <CopyNote quote={<>"Not Just Milk, A Mother's Choice"</>} tilt={-1.2} back={2.5}>Jobs to be done: the relief of making the right choice for their child, backed by guaranteed quality.</CopyNote>
        </div>
        <div className="a2-pair"><Label red>Sub target</Label><Note tilt={0.8} tape={false} pad="var(--space-4)"><div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'center' }}><img src="uploads/a2-tg-sub.png" alt="" style={{ width: 88, height: 88, borderRadius: '50%', objectFit: 'cover', flex: 'none' }} /><div className="cs-group" style={{ gap: 'var(--space-2)' }}><h4 className="cs-h4">Sensitive stomachs</h4><Sm>Consumers who aren't lactose intolerant but still experience stomach discomfort from regular milk.</Sm><Sm>#19to49 #selective #premium</Sm></div></div></Note>
          <CopyNote quote={<>"It's Not You, It's Milk"</>} tilt={1} back={-2.5}>Jobs to be done: a different kind of milk. Reframe the problem from their stomach to the milk.</CopyNote>
        </div>
      </Cols></Group>
      <Group label="Two digital films, two stories"><Cols n={2}>
        <Film k="Film 01 · Post-weaning moms" items={[['a2-film-1', 'uploads/그림1.png'], ['a2-film-1b', 'uploads/그림2.png'], ['a2-film-1c', 'uploads/그림3-a68e9c0b.jpg']]} lines={['"We just finished breastfeeding. What should my child drink now?"', '"Would you give just any milk to your child?"', 'Yonsei A2 Milk is recommended as the next best choice.']} />
        <Film k="Film 02 · Sensitive stomachs" items={[['a2-film-2', 'uploads/그림6.jpg'], ['a2-film-2b', 'uploads/그림7.jpg'], ['a2-film-2c', 'uploads/그림8.jpg']]} lines={['"Milk always makes my stomach hurt…"', '"It\'s not your stomach, it\'s the milk."', 'Yonsei A2 Milk is introduced as the solution.']} />
      </Cols></Group>
    </CaseSection>
    </Band>
    <CaseSection num="03" title="Execution">
      <Group label="Strategy">
        <P><strong>Paid media: Driving awareness and search</strong><br />We ran paid media from March to May on a budget of ₩200,000,000 (approx. €140,000), targeting by age and gender, demographics, interests, navigation destinations and online shopping purchase history. We used Netflix on TV devices only for its 95%+ guaranteed VTR to reach the main target, layered with YouTube (demographic and interest targeting), Naver (detailed parent targeting) and Instagram (cost-efficient reach). On YouTube, we produced seven versions of bumper ads, and I ran A/B tests to refine the ads each month based on the results.</P>
        <P><strong>Sponsored content: Owning search and educating parents</strong><br />One SEO-optimised Naver blog post held the #1–2 spot for “A2 milk” for two months, while 40–60 micro-influencer posts per month pushed competitor content down. On YouTube, we partnered with educational content creators to inform mothers, and with lifestyle vloggers who featured the product naturally in their daily lives.</P>
        <P><strong>Promotion &amp; retargeting: Converting and looping back</strong><br />Every piece of content linked to the promotion landing page. Discount promotions and review events on the online store drove conversions and encouraged customers to leave reviews that attracted new buyers. We tracked customers throughout their journey and used the data to retarget them.</P>
      </Group>
      <Group label="Action plan"><ActionPlan /></Group>
